<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - GOLDENBOOT TOURNAMENT HAWASSA</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand"><a href="/" style="color:inherit;text-decoration:none;">GOLDENBOOT TOURNAMENT <small>HAWASSA</small></a></div>
    <nav id="header-nav"></nav>
  </header>

  <main style="max-width:400px;">
    <h1>Admin / Referee Login</h1>
    <form class="card" id="login-form">
      <label>Username</label>
      <input type="text" id="username" required />
      <label>Password</label>
      <input type="password" id="password" required />
      <button class="btn" type="submit" style="margin-top:16px;width:100%;">Log In</button>
    </form>
    <div id="login-msg"></div>
  </main>

  <footer class="site-footer">GOLDENBOOT TOURNAMENT HAWASSA</footer>

  <script src="/js/api.js"></script>
  <script>
    renderHeaderNav();
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('login-msg');
      try {
        await api.post('/api/auth/login', {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        });
        window.location.href = '/admin.html';
      } catch (err) {
        msg.innerHTML = `<div class="msg error">${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
